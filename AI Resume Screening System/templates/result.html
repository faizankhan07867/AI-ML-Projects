<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Analysis Result</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Resume Analysis</h1>

    <h2>ATS Score</h2>

  <div class="progress">
    <!-- <div class="progress-bar" style="width: {{ score }}%;"> -->
        {{ score }}%
    </div>
</div>
        

    <h2>Skills Found</h2>

    {% if skills %}
        <ul>
            {% for skill in skills %}
                <li>{{ skill }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No skills detected.</p>
    {% endif %}

    <br>

    <a href="{{ url_for('home') }}">
        <button type="button">Upload Another Resume</button>
    </a>

</div>

</body>
</html>
