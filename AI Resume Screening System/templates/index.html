<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Resume Screening</title>

<link rel="stylesheet"
href="{{ url_for('static',filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>📄 AI Resume Screening System</h1>

<p>Upload Resume (PDF)</p>

<form action="/upload"
method="POST"
enctype="multipart/form-data">

<input
type="file"
name="resume"
accept=".pdf"
required>

<br><br>

<button type="submit">

Analyze Resume

</button>

</form>

</div>

</body>

</html>
